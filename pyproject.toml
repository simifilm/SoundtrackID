[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundtrackID"
version = "0.1.0"
description = "Film Music Analysis Pipeline"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyacrcloud>=1.0",
    "pyyaml>=6.0",
    "av>=10.0",
    "scipy>=1.10",
    "librosa>=0.10",
]

[project.optional-dependencies]
# Bundled desktop app
app = [
    "soundtrackID[onnx,shazam,web,metadata]",
]
demucs = [
    "demucs>=4.0",
    "torch>=2.0",
]
hf = [
    "transformers>=4.30",
    "torch>=2.0",
]
onnx = [
    "onnxruntime>=1.16",
]
# Shazam prefers Apple's native ShazamKit (shazamkit/ Swift helper); shazamio is
# the fallback used until the ShazamKit entitlement/profile is in place.
shazam = [
    "shazamio>=0.7",
    "truststore>=0.9",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
]
metadata = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
build = [
    "pyinstaller>=6.0",
]

[tool.uv.sources]
pyacrcloud = { git = "https://github.com/acrcloud/acrcloud_sdk_python", marker = "sys_platform == 'win32'" }

[tool.hatch.build.targets.wheel]
packages = ["src/soundtrackID"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
