[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundtrackid"
dynamic = ["version"]
description = "Film Music Analysis Pipeline"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
    "pyacrcloud>=1.0",
    "av>=10.0",
    "scipy>=1.10",
    "librosa>=0.10",
]

[project.scripts]
soundtrackid = "soundtrackid.cli:main"

[project.optional-dependencies]
# Bundled desktop app
app = [
    "soundtrackid[onnx,shazam,web,metadata]",
]
demucs = [
    "demucs>=4.0",
    "torch>=2.0",
]
hf = [
    "transformers>=4.30",
    "torch>=2.0",
]
onnx = [
    "onnxruntime>=1.16",
]
# Shazam prefers Apple's native ShazamKit (shazamkit/ Swift helper); shazamio is
# the fallback used until the ShazamKit entitlement/profile is in place.
shazam = [
    "audioop-lts>=0.2.2",
    "shazamio>=0.7",
    "truststore>=0.9",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
    "pyarrow>=26.0.1",
]
metadata = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "playwright>=1.65.0",
    "pyright>=1.1.414",
    "pytest>=7.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.1",
]
build = [
    "pyinstaller>=6.0",
]

[tool.uv.sources]
pyacrcloud = { git = "https://github.com/acrcloud/acrcloud_sdk_python", marker = "sys_platform == 'win32'" }

[tool.hatch.version]
path = "src/soundtrackid/__init__.py"

# The wheel holds the package only: the model (assets/) and the ShazamKit helper
# (shazamkit/) stay in the checkout, so SoundtrackID runs from a checkout or as the
# desktop app, not from a pip-installed wheel (see paths.py).
[tool.hatch.build.targets.wheel]
packages = ["src/soundtrackid"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: drives the page in a headless Chromium (tests/ui)"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
