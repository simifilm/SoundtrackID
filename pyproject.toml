[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiwi-filmmusik"
version = "0.1.0"
description = "Film Music Analysis Pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "av>=10.0",
    "scipy>=1.10",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
demucs = [
    "demucs>=4.0",
    "torch>=2.0",
]
hf = [
    "transformers>=4.30",
    "torch>=2.0",
]
onnx = [
    "onnxruntime>=1.16",
]
shazam = [
    "shazamio>=0.7",
    "truststore>=0.9",
]
acrcloud = [
    "pyacrcloud>=1.0",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
]
build = [
    "pyinstaller>=6.0",
]
metadata = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fiwi_filmmusik"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
